# Throwaway diagnostic for nushell#19419. Only exists on the diag_19419 branch of a fork.
name: diag-19419

on:
  push:
    branches:
      - diag_19419

permissions:
  contents: read

jobs:
  released:
    name: nu 0.116.1 (release binary)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install pywinpty==3.1.2 psutil==7.2.2

      - name: Fetch nu 0.116.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.116.1 --repo nushell/nushell --pattern 'nu-0.116.1-x86_64-pc-windows-msvc.zip' --dir dl
          Expand-Archive dl\*.zip -DestinationPath dl\nu
          $nu = (Get-ChildItem dl\nu -Recurse -Filter nu.exe | Select-Object -First 1).FullName
          "NU_EXE=$nu" >> $env:GITHUB_ENV

      - name: Probe
        if: false
        timeout-minutes: 25
        env:
          PYWINPTY_BACKEND: "0"
        run: python .github/diag_19419/probe.py --nu "$env:NU_EXE" --out out\release

      - name: Probe with real key events
        timeout-minutes: 15
        run: python .github/diag_19419/probe_gui.py --nu "$env:NU_EXE" --out out\gui

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-release
          path: out

  main:
    if: false
    name: nu main (debug build)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: python -m pip install pywinpty==3.1.2 psutil==7.2.2

      - name: Build nu
        run: cargo build --locked -p nu --bin nu

      - name: Probe
        timeout-minutes: 25
        env:
          PYWINPTY_BACKEND: "0"
        run: python .github/diag_19419/probe.py --nu target\debug\nu.exe --out out\main

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: probe-main
          path: out
